name: Restore AIST 2019 from Web Archive

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[archive complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download the 2019 site
        run: python3 mirror_wayback.py --url http://2019.aistconf.org/ --timestamp 20191225072825 --output restored-site --base 2019 --max-urls 500

      - name: Prepare static GitHub Pages copy
        run: |
          find restored-site -type f | head
          cp -a restored-site/. .
          rm -rf restored-site
          touch .nojekyll
          rm mirror_wayback.py
          rm rewrite_links.py

      - name: Commit restored site
        run: |
          git config user.name "AIST Archive Bot"
          git config user.email "org@aistconf.org"
          git add -A
          git commit -m "Restore archived AIST 2019 website [archive complete]"
          git push
